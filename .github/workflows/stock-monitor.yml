name: stock-monitor
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python monitor.py --once
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
